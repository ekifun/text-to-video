apiVersion: v1
kind: Service
metadata:
  name: text-to-video-api
spec:
  selector:
    app: text-to-video-api
  ports:
    - port: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: text-to-video-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: text-to-video-api
  template:
    metadata:
      labels:
        app: text-to-video-api
    spec:
      containers:
        - name: text-to-video-api
          image: text-to-video-api:latest  # 🟡 Replace if using local build
          imagePullPolicy: Never
          ports:
            - containerPort: 8080
          env:
            - name: REDIS_ADDR
              value: redis:6379
            - name: KAFKA_BROKERS
              value: kafka:9092
